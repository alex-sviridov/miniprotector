services:
  step-ca:
    image: smallstep/step-ca
    volumes:
      - ./ca/data:/home/step
      - ./ca/entrypoint.sh:/home/step/entrypoint.sh:ro
      - ./ca/templates/leaf.tpl:/home/step/templates/leaf.tpl:ro
    ports:
      - "9000:9000"
    entrypoint: ["/home/step/entrypoint.sh"]
    restart: unless-stopped

  issuer:
    build:
      context: ../..
      dockerfile: deploy/control-plane/issuer/Dockerfile
    depends_on:
      - step-ca
    volumes:
      - ./issuer/data:/data
      - ./issuer/local.conf:/data/local.conf:ro
      - ./ca/data/certs/root_ca.crt:/data/root_ca.crt:ro
      - ./ca/data/secrets/password:/data/secrets/password:ro
      - ./client-manager/data:/data/client-manager
    environment:
      - MP_CONFIG_PATH=/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  catalog:
    build:
      context: ../..
      dockerfile: deploy/control-plane/catalog/Dockerfile
    depends_on:
      - step-ca
      - issuer
    volumes:
      - ./catalog/data:/data
      - ./catalog/local.conf:/data/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
      - STORAGE_PATH=/data/storage
    ports:
      - "15723:15723"
    restart: unless-stopped

  policy-server:
    build:
      context: ../..
      dockerfile: deploy/control-plane/policy-server/Dockerfile
    depends_on:
      - step-ca
      - issuer
    volumes:
      - ./policy-server/data:/data
      - ./policy-server/local.conf:/data/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
    ports:
      - "9300:9300"
    restart: unless-stopped
