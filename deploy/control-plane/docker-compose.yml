services:
  step-ca:
    image: smallstep/step-ca
    volumes:
      - ./ca/data:/home/step
      - ./ca/entrypoint.sh:/home/step/entrypoint.sh:ro
      - ./ca/templates/leaf.tpl:/home/step/templates/leaf.tpl:ro
    ports:
      - "9000:9000"
    entrypoint: ["/home/step/entrypoint.sh"]
    restart: unless-stopped

  issuer:
    build:
      context: ../..
      dockerfile: deploy/build/Dockerfile
      target: issuer-controlplane
    depends_on:
      - step-ca
    volumes:
      - ./issuer/data:/data
      - ./issuer/local.conf:/data/local.conf:ro
      - ./ca/data/certs/root_ca.crt:/data/root_ca.crt:ro
      - ./ca/data/secrets/password:/data/secrets/password:ro
      - ./client-manager/data:/data/client-manager
    environment:
      - MP_CONFIG_PATH=/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  clientmanager-api:
    build:
      context: ../..
      dockerfile: deploy/build/Dockerfile
      target: clientmanager-api
    depends_on:
      - step-ca
      - issuer
    volumes:
      - ./clientmanager-api/data:/data
      - ./clientmanager-api/local.conf:/data/local.conf:ro
      - ./client-manager/data:/data/client-manager
      - ./ca/data/certs/root_ca.crt:/data/root_ca.crt:ro
      - ./ca/data/secrets/password:/data/secrets/password:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
    ports:
      - "9500:9500"
      - "9501:9501"
    restart: unless-stopped

  catalog:
    build:
      context: ../..
      dockerfile: deploy/build/Dockerfile
      target: catalog
    depends_on:
      - step-ca
      - issuer
    volumes:
      - ./catalog/data:/data
      - ./catalog/local.conf:/data/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
      - STORAGE_PATH=/data/storage
    ports:
      - "15723:15723"
    restart: unless-stopped

  api-server:
    build:
      context: ../..
      dockerfile: deploy/build/Dockerfile
      target: api-server
    depends_on:
      - step-ca
      - issuer
      - clientmanager-api
      - catalog
      - policy-server
    volumes:
      - ./api-server/data:/data
      - ./api-server/local.conf:/data/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
    ports:
      - "8090:8090"
    restart: unless-stopped

  policy-server:
    build:
      context: ../..
      dockerfile: deploy/build/Dockerfile
      target: policy-server
    depends_on:
      - step-ca
      - issuer
    volumes:
      - ./policy-server/data:/data
      - ./policy-server/local.conf:/data/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
    ports:
      - "9300:9300"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.3
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - ./loki/data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    restart: unless-stopped

  log-gateway:
    build:
      context: ../..
      dockerfile: deploy/build/Dockerfile
      target: log-gateway
    depends_on:
      - step-ca
      - issuer
      - loki
    volumes:
      - ./log-gateway/data:/data
      - ./log-gateway/local.conf:/data/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
      - LOKI_URL=http://loki:3100
    ports:
      - "9400:9400"
    restart: unless-stopped
