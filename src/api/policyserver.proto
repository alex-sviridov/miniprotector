syntax = "proto3";

package policyserverservice;

option go_package = "./proto";

import "google/protobuf/timestamp.proto";

// PolicyService is policy-server's RPC surface. GetPolicies answers "which
// policies apply to me?" for a mesh node, derived entirely from its verified
// mTLS identity. ListPolicies/CreatePolicy/UpdatePolicy/DeletePolicy are the
// admin surface api-server proxies for browsing and editing the full policy
// set -- unlike GetPolicies, these are never called by a mesh node itself.
service PolicyService {
  rpc GetPolicies(GetPoliciesRequest) returns (GetPoliciesResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc CreatePolicy(CreatePolicyRequest) returns (Policy);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (Policy);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
}

message GetPoliciesRequest {}

message GetPoliciesResponse {
  repeated Policy policies = 1;
}

message ListPoliciesRequest {
  // Optional. "backup", "storage", or "restore" -- when set, only policies
  // of this type are returned. Empty returns every type (unfiltered,
  // today's behavior).
  string type = 1;
}

message ListPoliciesResponse {
  repeated Policy policies = 1;
}

message ClientFilters {
  repeated string hostnames = 1;
  map<string, string> labels = 2;
}

message ObjectFilter {
  string path = 1;
  repeated string include = 2;
  repeated string exclude = 3;
  // policy-server-computed, deterministic (see Policy.id). Not present in
  // the on-disk policy JSON schema.
  string id = 4;
}

message PolicyCheckin {
  string hostname = 1;
  google.protobuf.Timestamp last_seen_at = 2;
}

// One restore-cart selection rule: host-agnostic (Host == "") folder rules
// and host-specific file rules resolve by longest-matching-path-ancestor,
// exactly like web/src/utils/restoreRules.js's resolveFile. policy-server
// never interprets these beyond the load-time validation in
// RestorePolicy.Validate (non-empty Path); resolution happens at verify
// time, in rwfs.
message RestoreRule {
  string host    = 1; // "" = host-agnostic, matches every source host
  string path    = 2;
  bool   include = 3;
}

message Policy {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  repeated ObjectFilter object_filters = 4;
  // Duration string, e.g. "24h" (time.ParseDuration format). policy-server
  // never parses or evaluates this -- opaque pass-through data.
  string rpo = 5;
  // List of cron expressions (5-field). policy-server never parses or
  // evaluates these -- opaque pass-through data.
  repeated string backup_window = 6;
  // reserved 7 was "destination" -- removed, replaced by the repeated
  // destinations field below. See
  // docs/superpowers/specs/2026-08-04-backup-destination-checkin-list-design.md.
  reserved 7;
  reserved "destination";
  // policy-server-computed, deterministic from the policy file's name --
  // stable across reloads, changes only if the file is renamed. Not
  // present in the on-disk policy JSON schema.
  string id = 8;
  // Only ever populated by ListPolicies/CreatePolicy/UpdatePolicy -- omitted
  // by GetPolicies so a node never learns another node's targeting rules
  // from a policy that already matched its own identity.
  ClientFilters client_filters = 9;
  // Derived from the name of the subfolder the policy file was loaded from
  // (e.g. "backup" for policies/backup/*.json) -- never read from or
  // written to the on-disk policy JSON. Populated by both GetPolicies and
  // ListPolicies.
  string type = 10;
  // reserved 11 was "hostname" -- removed, targeting a storage policy at a
  // node is client_filters only now, same as a backup policy; see
  // docs/superpowers/specs/2026-07-28-agent-storage-supervision-design.md
  reserved 11;
  reserved "hostname";
  // storage policy only.
  int32 port = 12;
  // "storage" policy only -- opaque JSON text, verbatim passthrough. Never
  // parsed or interpreted by policy-server beyond checking
  // well-formedness. A "restore" policy carries no config: its selection
  // lives in the structured rules field (19) instead, as of 2026-08-10.
  string config = 13;
  // Zero/unset means never disabled. Once this time passes, GetPolicies
  // stops returning the policy (checked live, not cached); ListPolicies is
  // unaffected. Generic across every policy type -- policy-server attaches
  // no meaning to *why* a policy is disabled.
  google.protobuf.Timestamp disabled_at = 14;
  // "backup" and "restore" policy only, required. References a
  // "storage"-typed Policy.id; destination is resolved from it live on
  // every read.
  string storage_policy_id = 15;
  repeated PolicyCheckin checkins = 16; // ListPolicies only -- see below
  // "backup" and "restore" policy only. Derived, read-only: one
  // "host:port" entry per live checkin against storage_policy_id, freshest
  // checkin first. Empty if the storage policy has no checkins yet or
  // storage_policy_id is dangling. Unset for a "storage" policy, as
  // before. For "restore" these are the stores to verify against, not
  // write to.
  repeated string destinations = 17;
  // "restore" policy only. host:port of the source bwfs to restore from.
  // Removed 2026-08-10: replaced by storage_policy_id (field 15, shared
  // with "backup") + live destinations resolution, the same mechanism
  // backup already uses -- see
  // docs/superpowers/specs/2026-08-10-restore-policy-verification-design.md.
  reserved 18;
  reserved "source_store";
  // "restore" policy only.
  repeated RestoreRule rules = 19;
}

message CreatePolicyRequest {
  string name = 1;
  ClientFilters client_filters = 2;
  // Any id set on an entry here is ignored -- object filter IDs are always
  // server-computed from their position in this list.
  repeated ObjectFilter object_filters = 3;
  string rpo = 4;
  repeated string backup_window = 5;
  // reserved 6 was "destination" -- removed, destination is never itself
  // writable; it's derived from storage_policy_id. See
  // docs/superpowers/specs/2026-08-03-backup-policy-storage-link-design.md.
  reserved 6;
  reserved "destination";
  // "backup", "storage", or "restore" -- required. Determines which of the
  // type-specific fields are valid; mixing fields across types is rejected
  // (e.g. a "restore" request must not set object_filters/rpo/
  // backup_window/port/config).
  string type = 7;
  // reserved 8 was "hostname" -- removed, see Policy.reserved 11 above.
  reserved 8;
  reserved "hostname";
  int32 port = 9;
  string config = 10;
  google.protobuf.Timestamp disabled_at = 11;
  // "backup" and "restore", both required.
  string storage_policy_id = 12;
  // Removed 2026-08-10 -- see Policy.rules above.
  reserved 13;
  reserved "source_store";
  // "restore" policy only, required.
  repeated RestoreRule rules = 14;
}

message UpdatePolicyRequest {
  string id = 1;
  string name = 2;
  ClientFilters client_filters = 3;
  // Full replacement of object_filters, not a patch -- reordering or
  // inserting entries changes the affected filters' ids.
  repeated ObjectFilter object_filters = 4;
  string rpo = 5;
  repeated string backup_window = 6;
  // reserved 7 was "destination" -- removed, see CreatePolicyRequest above.
  reserved 7;
  reserved "destination";
  // A policy's type is immutable via UpdatePolicy -- there is no type field
  // here. port/config are only valid when the policy being updated is
  // already type "storage"; object_filters/rpo/backup_window/storage_policy_id
  // are only valid when it's already type "backup". "restore"-typed
  // policies cannot be updated at all -- UpdatePolicy rejects any request
  // whose target policy is type "restore" regardless of which fields it
  // sets, which is also why there is no rules field here.
  // reserved 8 was "hostname" -- removed, see Policy.reserved 11 above.
  reserved 8;
  reserved "hostname";
  int32 port = 9;
  string config = 10;
  google.protobuf.Timestamp disabled_at = 11;
  // "backup" only, required.
  string storage_policy_id = 12;
}

message DeletePolicyRequest {
  string id = 1;
}

message DeletePolicyResponse {}
