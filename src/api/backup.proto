syntax = "proto3";

package backupservice;

option go_package = "./proto";

service BackupService {
  rpc ProcessBackupStream(stream FileRequest) returns (stream FileResponse);
  rpc BackupCommit(BackupCommitRequest) returns (BackupCommitResponse);
}

message FileRequest {
  oneof request_type {
    FileInfo file_info = 2;
    ChunkHash chunk_hash = 3;
    ChunkData chunk_data = 4;
  }
}

message FileInfo {
  string file_id = 1; // hostname:fullpath:mtime
  bytes attributes = 2;
}

message ChunkHash {
  bytes hash = 1;
  int64 index = 2;
  int64 size = 3;
  bool  eof  = 4;
  uint32 checksum = 5; // CRC32-IEEE of chunk data, for file-level integrity
}

message ChunkData {
  bytes hash = 1;
  int64 index = 2;
  bytes data = 3;
  bool  eof  = 4;
}

message FileResponse {
  oneof response_type {
    FileNeeded file_needed = 2;
    ChunkNeeded chunk_needed = 3;
    ChunkResult chunk_result = 4;
    FileProcessingResult result = 5;
  }
}

message FileNeeded {
  string file_id = 1;
  bool needed = 2;
}

message ChunkNeeded {
  bytes hash = 1;
  bool needed = 2; 
}

message ChunkResult {
  bytes hash = 1;
  bool success = 2;
}

message FileProcessingResult {
  string file_id = 1;
  bool success = 2;
  bytes hash = 3;
}

message BackupCommitRequest {
  bytes file_list_hash = 1; // SHA256 over the sorted, newline-joined object IDs brfs believes it sent successfully
}

message BackupCommitResponse {
  bool success = 1;
}
