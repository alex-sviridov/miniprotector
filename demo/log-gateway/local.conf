default_port=8080
default_streams=8
log_dir=/var/log/miniprotector
ca_host=ca:9000
issuer_host=issuer
issuer_port=9200
catalog_host=catalog

# The one port every host's listener serves control-plane gRPC on; dialed on
# each *_host below. Services themselves listen only on internal sockets.
listener_port=9300
policy_server_host=policy-server

# Where this node's agent-managed Vector process pushes logs, via
# log-gateway's own mTLS-verifying proxy in front of Loki.
log_gateway_host=log-gateway
log_gateway_port=9400

ReconcileIntervalSec=30
BootstrapCertRefreshIntervalSec=86400
OperatingCertFetchIntervalSec=900
JobTimeoutSec=30
var_path=/data/client-manager
ConnectionTimeOutSec=30
FileLockTimeoutSec=30

# The port api-server's REST listener binds to.
api_server_port=8090
api_server_token=dev-placeholder-token-change-me

# Where api-server dials clientmanager-api.
clientmanager_api_host=clientmanager-api
clientmanager_admin_api_host=clientmanager-api

# api-server's host, dialed on listener_port for its job-status gRPC service --
# used only by policy-server's restore-cleanup sweep (restore_cleanup.go)
# to ask "has this restore/verify job finished yet".
api_server_host=api-server

# Shortened from their production defaults (300s / 900s) so a finished
# restore/verify policy's cleanup is observable within a practical e2e
# run -- see web/e2e/live-job-updates.spec.js's restore-lifecycle test.
RestoreCleanupIntervalSec=5
RestoreCleanupGracePeriodSec=5
RwfsRetries=3

# Processes agent keeps running in this container (started once the operating
# certificate exists, restarted on crash). Everything above is identical to the
# shared ../local.conf (a test enforces that); only the lines below differ.
running_service=log-gateway --loki-url ${LOKI_URL:-http://loki:3100} --debug=${DEBUG:-false}
