services:
  ca:
    build:
      context: ..
      dockerfile: deploy/build/Dockerfile
      target: ca-demo
    volumes:
      - ca-data:/home/step
      - client-manager-data:/data/client-manager
      - ./ca/clientmanager-local.conf:/data/client-manager-conf/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data/client-manager-conf
    restart: unless-stopped

  issuer:
    build:
      context: ..
      dockerfile: deploy/build/Dockerfile
      target: issuer-demo
    depends_on:
      - ca
    volumes:
      - issuer-data:/data
      - ./local.conf:/data/local.conf:ro
      - client-manager-data:/data/client-manager
      - ca-data:/ca-data:ro
    environment:
      - MP_CONFIG_PATH=/data
    restart: unless-stopped

  clientmanager-api:
    build:
      context: ..
      dockerfile: deploy/build/Dockerfile
      target: clientmanager-api
    depends_on:
      - ca
      - issuer
    volumes:
      - clientmanager-api-data:/data
      - ./local.conf:/data/local.conf:ro
      - client-manager-data:/data/client-manager
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
    ports:
      - "9500:9500"
    restart: unless-stopped

  catalog:
    build:
      context: ..
      dockerfile: deploy/build/Dockerfile
      target: catalog
    depends_on:
      - ca
      - issuer
    volumes:
      - catalog-data:/data
      - ./local.conf:/data/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
      - STORAGE_PATH=/data/storage
    restart: unless-stopped

  api-server:
    build:
      context: ..
      dockerfile: deploy/build/Dockerfile
      target: api-server
    depends_on:
      - ca
      - issuer
      - clientmanager-api
      - catalog
      - policy-server
    volumes:
      - api-server-data:/data
      - ./local.conf:/data/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
    ports:
      - "8090:8090"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    depends_on:
      - api-server
    ports:
      - "8091:80"
    restart: unless-stopped

  policy-server:
    build:
      context: ..
      dockerfile: deploy/build/Dockerfile
      target: policy-server
    depends_on:
      - ca
      - issuer
    volumes:
      - policy-server-data:/data
      - ./local.conf:/data/local.conf:ro
      - ./policy-server/policies:/data/policies
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.3
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    restart: unless-stopped

  log-gateway:
    build:
      context: ..
      dockerfile: deploy/build/Dockerfile
      target: log-gateway
    depends_on:
      - ca
      - issuer
      - loki
    volumes:
      - log-gateway-data:/data
      - ./local.conf:/data/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
      - LOKI_URL=http://loki:3100
    restart: unless-stopped

  database:
    hostname: database
    build:
      context: ..
      dockerfile: deploy/build/Dockerfile
      target: backup-host
    depends_on:
      - ca
      - issuer
      - log-gateway
    volumes:
      - database-data:/data
      - ./local.conf:/data/local.conf:ro
      - ./sample-data/audit:/var/log/audit:ro
      - ./sample-data/db:/var/lib/dbdata:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
    restart: unless-stopped

  webserver:
    hostname: webserver
    build:
      context: ..
      dockerfile: deploy/build/Dockerfile
      target: backup-host
    depends_on:
      - ca
      - issuer
      - log-gateway
    volumes:
      - webserver-data:/data
      - ./local.conf:/data/local.conf:ro
      - ./sample-data/audit:/var/log/audit:ro
      - ./sample-data/web:/var/www/html:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
    restart: unless-stopped

  store:
    build:
      context: ..
      dockerfile: deploy/build/Dockerfile
      target: backup-host
    depends_on:
      - ca
      - issuer
      - catalog
      - log-gateway
    volumes:
      - store-data:/data
      - ./local.conf:/data/local.conf:ro
    environment:
      - MP_CONFIG_PATH=/data
      - MP_CERT_TOKEN=${MP_CERT_TOKEN:-}
      - STORAGE_PATH=/data/storage
    restart: unless-stopped

volumes:
  ca-data:
  client-manager-data:
  issuer-data:
  clientmanager-api-data:
  catalog-data:
  api-server-data:
  policy-server-data:
  loki-data:
  log-gateway-data:
  database-data:
  webserver-data:
  store-data:
